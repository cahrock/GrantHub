services:
  mysql:
    image: mysql:8.0
    container_name: granthub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: granthub
      MYSQL_USER: granthub
      MYSQL_PASSWORD: granthubpassword
    ports:
      - "3307:3306"
    volumes:
      - granthub-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  granthub-mysql-data: